name: Generate GitHub Trophies

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate Trophy
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: "username=akbarpurba&theme=flat&no-frame=true&no-bg=true&column=6&margin-w=8&margin-h=8"
          path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/trophy.svg

          git diff --cached --quiet || git commit -m "chore: update github trophies"

          git push